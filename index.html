<!DOCTYPE html>
<html lang="zh-CN">
<body>
  <div>当前game的值：<span id="gameText"></span></div>
  <input id="gameInput" placeholder="输入game内容">
  <button onclick="fetchData()">读取数据</button>
  <button onclick="saveData()">保存到数据库</button>

  <script>
    //读取数据库
    async function fetchData() {
      const res = await fetch("/api/readData")
      const json = await res.json()
      document.getElementById("gameText").innerText = json.game
      document.getElementById("gameInput").value = json.game
    }
    //写入数据库
    async function saveData() {
      const gameVal = document.getElementById("gameInput").value
      await fetch("/api/writeData", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ game: gameVal })
      })
      alert("保存成功！")
      fetchData()
    }
  </script>
</body>
</html>
